# GitHub-style release notes, including non-Conventional Commits.
# Based on https://github.com/orhun/git-cliff/blob/main/examples/github.toml
[remote.github]
owner = "mumu-lhl"
repo = "tixun"

[changelog]
header = ""
body = """
## What's Changed
{% for commit in commits %}\
* {{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.remote.username %} by @{{ commit.remote.username | replace(from="[bot]", to="") }}{% endif %}\
{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }})\
{% else %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))\
{% endif %}
{% endfor %}\
{% if github %}\
{% set newcomers = github.contributors | filter(attribute="is_first_time", value=true) %}\
{% if newcomers | length > 0 %}
### New Contributors
{% for contributor in newcomers %}\
* @{{ contributor.username | replace(from="[bot]", to="") }} made their first contribution\
{% if contributor.pr_number %} in [#{{ contributor.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}\
{% endif %}\
{% endif %}\
{% if previous.version and version %}
**Full Changelog**: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}
{% elif version %}
**Full Changelog**: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commits/{{ version }}
{% endif %}
"""
trim = true
footer = "\n<!-- generated by git-cliff -->\n"

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
use_branch_tags = true
sort_commits = "oldest"
