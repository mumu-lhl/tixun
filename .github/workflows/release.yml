name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a tag and matching application version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo '请从版本标签运行此工作流。' >&2
            exit 1
          fi
          python3 scripts/check_release_tag.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify-and-build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      android_release: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

  publish:
    needs: [prepare, verify-and-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ANDROID_APK: ${{ needs.verify-and-build.outputs.android_apk }}
      ANDROID_SUFFIX: ${{ needs.verify-and-build.outputs.android_suffix }}
      LINUX_SUFFIX: ${{ needs.verify-and-build.outputs.linux_suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-and-build.outputs.android_artifact }}
          path: downloaded/android
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-and-build.outputs.linux_artifact }}
          path: downloaded/linux
      - name: Package applications and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "downloaded/android/${ANDROID_APK}" "dist/tixun-${RELEASE_TAG}-${ANDROID_SUFFIX}"
          test -f downloaded/linux/tixun
          chmod u+x downloaded/linux/tixun
          tar -czf "dist/tixun-${RELEASE_TAG}-${LINUX_SUFFIX}" -C downloaded/linux .
          (cd dist && sha256sum ./*.apk ./*.tar.gz > SHA256SUMS)
      - name: Resolve previous published release
        id: base
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --repo "$GH_REPO" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub-style changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: >-
            --current --tag-pattern '${{ steps.base.outputs.tag_pattern }}'
            --github-repo ${{ github.repository }} --output release-notes.md
      - name: Add installation notes
        run: |
          cat >> release-notes.md <<'NOTES'

          ## 下载与安装

          - **Android 10+**：下载 `android-release.apk` 结尾的文件安装。此 APK 使用 Release 模式构建并由项目发布密钥签名。从旧开发签名版本迁移时需要先导出学习数据，再卸载安装和恢复；后续相同签名版本可覆盖更新。
          - **Linux x86_64**：解压 `linux-x64.tar.gz`，运行其中的 `tixun`，保留同目录下的 `lib` 和 `data`。需要 GTK 3，保存密钥需要可用的系统密钥环。
          - `SHA256SUMS` 用于检查下载文件是否完整。

          学习数据默认保存在本地。AI 功能需要自行配置 API Key。
          NOTES
      - name: Create or resume a draft, then publish complete assets
        run: |
          set -euo pipefail
          # A rerun may resume an incomplete draft, but must never replace a published release.
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "该版本已发布，停止覆盖。"'
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "题训 ${RELEASE_TAG}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
