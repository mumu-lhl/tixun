name: Build and verify
on:
  push:
    branches: ['**']
    paths: ['lib/**', 'test/**', 'integration_test/**', 'assets/**', 'pubspec.*', 'build.yaml', 'analysis_options.yaml', 'android/**', 'linux/**', 'scripts/**', '.github/workflows/**']
  pull_request:
    paths: ['lib/**', 'test/**', 'integration_test/**', 'assets/**', 'pubspec.*', 'build.yaml', 'analysis_options.yaml', 'android/**', 'linux/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
  workflow_call:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.9'
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --reporter expanded | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test.log
            test/failures/
  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tixun-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
  linux:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash scripts/install_linux_deps.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter doctor -v | tee doctor.log
      - run: flutter build linux --release
      - run: mkdir -p artifacts && cp -a build/linux/x64/release/bundle artifacts/linux-production
      - run: flutter build linux --release --dart-define=TIXUN_DEMO=true
      - run: scripts/gui_smoke.sh
      - run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- flutter test integration_test/chat_flow_test.dart -d linux --dart-define=TIXUN_DEMO=true | tee integration.log
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- flutter test integration_test/learning_materials_test.dart -d linux --dart-define=TIXUN_DEMO=true | tee integration-materials.log
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- flutter test integration_test/practice_flow_test.dart -d linux --dart-define=TIXUN_DEMO=true | tee integration-practice.log
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- flutter test integration_test/backup_flow_test.dart -d linux --dart-define=TIXUN_DEMO=true | tee integration-backup.log
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- flutter test integration_test/practice_management_test.dart -d linux --dart-define=TIXUN_DEMO=true | tee integration-management.log
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tixun-linux-and-gui
          path: |
            artifacts/
            doctor.log
            integration.log
            integration-materials.log
            integration-practice.log
            integration-backup.log
            integration-management.log
