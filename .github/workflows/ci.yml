name: Build and verify
on:
  push:
    branches: ['**']
    paths: ['lib/**', 'python/**', 'test/**', 'integration_test/**', 'assets/**', 'pubspec.*', 'build.yaml', 'analysis_options.yaml', 'android/**', 'linux/**', 'scripts/**', 'cliff.toml', '.github/workflows/**']
  pull_request:
    paths: ['lib/**', 'python/**', 'test/**', 'integration_test/**', 'assets/**', 'pubspec.*', 'build.yaml', 'analysis_options.yaml', 'android/**', 'linux/**', 'scripts/**', 'cliff.toml', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      android_release:
        description: Build signed Universal and per-ABI Release APKs
        type: boolean
        default: false
      full_gui:
        description: Run the complete native GUI regression suite
        type: boolean
        default: false
      run_tests:
        description: Run unit and GUI test suites
        type: boolean
        default: true
      nightly_tag:
        description: Nightly tag baked into the build for in-app update comparison (e.g. nightly-20261109-203000); empty for ordinary and formal release builds
        type: string
        default: ''
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
    inputs:
      android_release:
        description: Build signed Universal and per-ABI Release APKs
        type: boolean
        default: false
      full_gui:
        description: Run the complete native GUI regression suite
        type: boolean
        default: false
      run_tests:
        description: Run unit and GUI test suites
        type: boolean
        default: true
      nightly_tag:
        description: Nightly tag baked into the build for in-app update comparison (e.g. nightly-20261109-203000); empty for ordinary and formal release builds
        type: string
        default: ''
    outputs:
      android_artifact:
        value: ${{ jobs.android.outputs.artifact_name }}
      linux_artifact:
        value: ${{ jobs.linux.outputs.artifact_name }}
      linux_suffix:
        value: ${{ jobs.linux.outputs.release_suffix }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.android_release && 'release' || 'debug' }}-${{ inputs.full_gui && 'full-gui' || 'smoke' }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '25'
  SERIOUS_PYTHON_VERSION: '3.13'
  SERIOUS_PYTHON_APP: ${{ github.workspace }}/python/runtime
  SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/python-packages
jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 -m unittest discover -s python -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-tixun-engines-v1
      - run: flutter config --no-analytics
      - name: Prime cached Android and Linux engines
        if: steps.flutter.outputs.CACHE-HIT != 'true'
        run: flutter precache --android --linux
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - name: Run unit tests
        if: format('{0}', inputs.run_tests) != 'false'
        run: flutter test --reporter expanded | tee test.log
      - uses: actions/upload-artifact@v4
        if: always() && format('{0}', inputs.run_tests) != 'false'
        with:
          name: test-results
          path: |
            test.log
            test/failures/
  android:
    name: ${{ inputs.android_release && 'Android Release APK and signature' || 'Android Debug APK' }}
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-tixun-engines-v1
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
          cache-cleanup: on-success
      - run: flutter config --no-analytics
      - name: Use the CI JDK for Flutter Android builds
        run: flutter config --jdk-dir="$JAVA_HOME"
      - run: flutter pub get --enforce-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: python-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: python-runtime-${{ runner.os }}-${{ runner.arch }}-
      - run: bash scripts/prepare_python.sh Android
      - name: Resolve Android artifact
        id: artifact
        env:
          BUILD_MODE: ${{ inputs.android_release && 'release' || 'debug' }}
        run: python3 scripts/build_artifacts.py metadata android --mode "$BUILD_MODE" >> "$GITHUB_OUTPUT"
      - name: Prepare Release signing
        if: inputs.android_release
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android_signing.py prepare >> "$GITHUB_OUTPUT"
      - name: Build Debug APK
        if: ${{ !inputs.android_release }}
        run: flutter build apk --debug
      - name: Build Universal and per-architecture Release APKs
        if: inputs.android_release
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/build_artifacts.py build-android-release artifacts/android-release --nightly-tag "${{ inputs.nightly_tag }}"
      - name: Verify Release signature and certificate
        if: inputs.android_release
        env:
          APK_PATH: ${{ steps.artifact.outputs.artifact_path }}
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: python3 scripts/android_signing.py verify "$APK_PATH"
      - name: Remove temporary signing files
        if: ${{ always() && inputs.android_release }}
        env:
          SIGNING_DIRECTORY: ${{ steps.signing.outputs.directory }}
        run: python3 scripts/android_signing.py cleanup
      - name: Verify Release build mode, architectures and versions
        if: inputs.android_release
        run: python3 scripts/build_artifacts.py verify-android-release artifacts/android-release
      - name: Verify embedded Python in every APK
        run: python3 scripts/check_python_bundle.py android build/app/outputs/flutter-apk/*.apk
      - name: Verify actual Debug APK build mode
        if: ${{ !inputs.android_release }}
        env:
          BUILD_MODE: ${{ steps.artifact.outputs.mode }}
          APK_PATH: ${{ steps.artifact.outputs.artifact_path }}
        run: python3 scripts/build_artifacts.py verify-apk "$APK_PATH" --mode "$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
  linux:
    name: Linux Release and GUI tests
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      release_suffix: ${{ steps.artifact.outputs.release_suffix }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash scripts/install_linux_deps.sh
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-tixun-engines-v1
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter doctor -v | tee doctor.log
      - uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: python-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: python-runtime-${{ runner.os }}-${{ runner.arch }}-
      - run: bash scripts/prepare_python.sh
      - name: Resolve Linux artifact
        id: artifact
        run: python3 scripts/build_artifacts.py metadata linux >> "$GITHUB_OUTPUT"
      - run: |
          if [ -n "${{ inputs.nightly_tag }}" ]; then
            flutter build linux --release --dart-define=TIXUN_NIGHTLY_TAG=${{ inputs.nightly_tag }}
          else
            flutter build linux --release
          fi
      - name: Verify embedded Python in production bundle
        run: python3 scripts/check_python_bundle.py linux build/linux/x64/release/bundle
      - name: Preserve production bundle
        env:
          BUNDLE_PATH: ${{ steps.artifact.outputs.bundle_path }}
        run: mkdir -p "$(dirname "$BUNDLE_PATH")" && cp -a build/linux/x64/release/bundle "$BUNDLE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.bundle_path }}
          if-no-files-found: error
      - run: flutter build linux --release --dart-define=TIXUN_DEMO=true
      - run: scripts/gui_smoke.sh
      - name: Run complete native GUI regressions
        if: inputs.full_gui && format('{0}', inputs.run_tests) != 'false'
        run: scripts/gui_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tixun-linux-gui
          path: |
            artifacts/gui*/
            doctor.log
            integration*.log
