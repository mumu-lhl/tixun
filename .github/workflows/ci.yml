name: Build and verify
on:
  push:
    branches: ['**']
    paths: ['lib/**', 'test/**', 'integration_test/**', 'assets/**', 'pubspec.*', 'build.yaml', 'analysis_options.yaml', 'android/**', 'linux/**', 'scripts/**', 'cliff.toml', '.github/workflows/**']
  pull_request:
    paths: ['lib/**', 'test/**', 'integration_test/**', 'assets/**', 'pubspec.*', 'build.yaml', 'analysis_options.yaml', 'android/**', 'linux/**', 'scripts/**', 'cliff.toml', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      android_release:
        description: Build an optimized Android Release APK
        type: boolean
        default: false
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
    inputs:
      android_release:
        description: Build an optimized Android Release APK
        type: boolean
        default: false
    outputs:
      android_artifact:
        value: ${{ jobs.android.outputs.artifact_name }}
      android_apk:
        value: ${{ jobs.android.outputs.apk_name }}
      android_suffix:
        value: ${{ jobs.android.outputs.release_suffix }}
      linux_artifact:
        value: ${{ jobs.linux.outputs.artifact_name }}
      linux_suffix:
        value: ${{ jobs.linux.outputs.release_suffix }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.android_release && 'release' || 'debug' }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.9'
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --reporter expanded | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test.log
            test/failures/
  android:
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      apk_name: ${{ steps.artifact.outputs.apk_name }}
      release_suffix: ${{ steps.artifact.outputs.release_suffix }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Resolve Android artifact
        id: artifact
        env:
          BUILD_MODE: ${{ inputs.android_release && 'release' || 'debug' }}
        run: python3 scripts/build_artifacts.py metadata android --mode "$BUILD_MODE" >> "$GITHUB_OUTPUT"
      - name: Prepare Release signing
        if: inputs.android_release
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android_signing.py prepare >> "$GITHUB_OUTPUT"
      - name: Build Debug APK
        if: ${{ !inputs.android_release }}
        run: flutter build apk --debug
      - name: Build signed Release APK
        if: inputs.android_release
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release
      - name: Verify Release signature and certificate
        if: inputs.android_release
        env:
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: python3 scripts/android_signing.py verify "$APK_PATH"
      - name: Remove temporary signing files
        if: ${{ always() && inputs.android_release }}
        env:
          SIGNING_DIRECTORY: ${{ steps.signing.outputs.directory }}
        run: python3 scripts/android_signing.py cleanup
      - name: Verify actual APK build mode
        env:
          BUILD_MODE: ${{ steps.artifact.outputs.mode }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
        run: python3 scripts/build_artifacts.py verify-apk "$APK_PATH" --mode "$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.apk_path }}
          if-no-files-found: error
  linux:
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      release_suffix: ${{ steps.artifact.outputs.release_suffix }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash scripts/install_linux_deps.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter doctor -v | tee doctor.log
      - name: Resolve Linux artifact
        id: artifact
        run: python3 scripts/build_artifacts.py metadata linux >> "$GITHUB_OUTPUT"
      - run: flutter build linux --release
      - name: Preserve production bundle
        env:
          BUNDLE_PATH: ${{ steps.artifact.outputs.bundle_path }}
        run: mkdir -p "$(dirname "$BUNDLE_PATH")" && cp -a build/linux/x64/release/bundle "$BUNDLE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.bundle_path }}
          if-no-files-found: error
      - run: flutter build linux --release --dart-define=TIXUN_DEMO=true
      - run: scripts/gui_smoke.sh
      - run: scripts/gui_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tixun-linux-gui
          path: |
            artifacts/gui*/
            doctor.log
            integration*.log
