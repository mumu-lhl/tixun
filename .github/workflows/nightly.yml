name: Publish nightly
on:
  schedule:
    # 04:30 Asia/Shanghai. GitHub may delay scheduled runs.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare nightly build identity
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for changes since the published nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output nightly-release.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API_URL/repos/$GH_REPO/releases/tags/nightly")
          if [ "$status" = 404 ]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = 200 ]; then
            draft=$(python3 -c 'import json; print(str(json.load(open("nightly-release.json"))["draft"]).lower())')
            if [ "$draft" = true ]; then
              # A failed publication may have moved the tag before uploading all assets.
              echo 'should_build=true' >> "$GITHUB_OUTPUT"
            elif [ "$(git rev-parse 'refs/tags/nightly^{commit}')" = "$(git rev-parse "$GITHUB_SHA^{commit}")" ]; then
              echo 'should_build=false' >> "$GITHUB_OUTPUT"
              echo 'The published nightly already contains this commit; skipping the build.'
            else
              echo 'should_build=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Failed to check the nightly release (HTTP $status)." >&2
            exit 1
          fi
      - id: tag
        if: steps.check.outputs.should_build == 'true'
        run: echo "tag=nightly-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  verify-and-build:
    name: Build and verify release
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      android_release: true
      run_checks: false
      run_gui: false
      run_tests: false
      nightly_tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

  publish:
    name: Publish nightly prerelease
    needs: [prepare, verify-and-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: nightly
      BUILD_ID: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LINUX_SUFFIX: ${{ needs.verify-and-build.outputs.linux_suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify-and-build.outputs.android_artifact }}
          path: downloaded/android
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify-and-build.outputs.linux_artifact }}
          path: downloaded/linux
      - name: Package applications and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/build_artifacts.py package-android --source downloaded/android --destination dist --tag "$RELEASE_TAG"
          test -f downloaded/linux/tixun
          chmod u+x downloaded/linux/tixun
          tar -czf "dist/tixun-${RELEASE_TAG}-${LINUX_SUFFIX}" -C downloaded/linux .
          (cd dist && sha256sum ./*.apk ./*.tar.gz > SHA256SUMS)
      - name: Resolve previous published release or nightly
        id: base
        run: python3 scripts/release_notes.py --nightly --tag "$RELEASE_TAG" --ref "$GITHUB_SHA" --repo "$GH_REPO" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub-style changelog
        if: steps.base.outputs.has_changes == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: >-
            '${{ steps.base.outputs.commit_range }}' --tag '${{ steps.base.outputs.current_commit }}'
            --tag-pattern '${{ steps.base.outputs.tag_pattern }}'
            --github-repo ${{ github.repository }} --output release-notes.md
      - name: Describe a nightly with no new commits
        if: steps.base.outputs.has_changes == 'false'
        run: |
          printf '## What\x27s Changed\n\n自上次发布以来没有新的代码提交，本次重新构建并验证。\n' > release-notes.md
      - name: Add exact comparison link
        env:
          BASE: ${{ steps.base.outputs.base_tag }}
        run: python3 scripts/release_notes.py --nightly --tag "$RELEASE_TAG" --ref "$GITHUB_SHA" --repo "$GH_REPO" --notes release-notes.md --base "$BASE"
      - name: Publish fixed nightly release
        run: |
          set -euo pipefail
          # Hide the release while replacing assets so clients never observe a
          # mixture of builds or a checksum file from the previous build.
          exists=false
          if gh release view "$RELEASE_TAG" --json isDraft,name,body > existing-release.json 2>/dev/null; then
            exists=true
            # Preserve the original boundary when resuming this build after a
            # failed upload or tag move.
            python3 -c 'import json,os,pathlib; r=json.load(open("existing-release.json")); p=pathlib.Path("release-notes.md"); p.write_text(r["body"], encoding="utf-8") if r.get("isDraft") and r.get("name") == "题训 " + os.environ["BUILD_ID"] and r.get("body") else None'
            gh release edit "$RELEASE_TAG" --draft=true --title "题训 ${BUILD_ID}" --notes-file release-notes.md
          fi
          old=$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" || true)
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          if [ -n "$old" ]; then
            git push --force-with-lease="refs/tags/${RELEASE_TAG}:${old}" origin "refs/tags/${RELEASE_TAG}"
          else
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          if [ "$exists" = true ]; then
            gh release edit "$RELEASE_TAG" --title "题训 ${BUILD_ID}" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
              --title "题训 ${BUILD_ID}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Remove old timestamped nightly releases
        run: python3 scripts/prune_nightlies.py --repo "$GH_REPO" --keep "$RELEASE_TAG" --apply
