org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Keep CI and cloud builds within a predictable memory budget.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G

# Reuse deterministic Gradle task outputs across CI runs.
org.gradle.caching=true
# Keep Universal and split APKs interchangeable when updating the same version.
force-version-code-ignoring-abi=true
