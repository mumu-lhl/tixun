name: tixun
description: 题训 — 理解知识，独立练习，真正掌握。
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.0
  uuid: ^4.6.0
  crypto: ^3.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
flutter:
  uses-material-design: true
  assets:
    - assets/demo/two_problems.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: TixunMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
