name: tixun
description: 题训 — 理解知识，独立练习，真正掌握。
publish_to: none
version: 0.6.0+8
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.11.0
  jose: ^0.3.5+2
  url_launcher: ^6.3.3
  dynamic_color: ^2.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  sqlite3: ^3.9.1
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.1
  uuid: ^4.6.0
  crypto: ^3.0.8
  archive: ^4.7.0
  wechat_assets_picker: ^10.1.3
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  extended_image: ^10.1.0
  wechat_camera_picker: ^4.6.0
  camera_android: ^0.10.13
  serious_python: 6.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analyzer: ^14.7.0
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo/two_problems.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: TixunMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
